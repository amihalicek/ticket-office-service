spring:
  datasource:
    url: jdbc:h2:file:./data/demo-db;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    database-platform: org.hibernate.dialect.H2Dialect

  liquibase:
    change-log: classpath:/db/changelog/db.changelog-master.yaml
    enabled: true

  h2:
    console:
      enabled: true
      path: /h2-console
